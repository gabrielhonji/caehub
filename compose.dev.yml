services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - .:/app
      - caehub_node_modules:/app/node_modules
    networks:
      - caehub_dev
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: caehub-dev-root
    volumes:
      - caehub_mysql:/var/lib/mysql
    networks:
      - caehub_dev

networks:
  caehub_dev:
    name: caehub_dev

volumes:
  caehub_node_modules:
  caehub_mysql:
